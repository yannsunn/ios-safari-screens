# iPhone シミュレーターの Safari で公開ページを開き、1画面目を撮影する。
# 公開リポジトリでは標準の macOS ランナーが無料（GitHub Docs「GitHub Actions の課金」）。
# 秘密値は一切使わない。撮ってよいのは誰でも見られる公開ページだけ。
name: iOS Safari screenshots

on:
  workflow_dispatch:
    inputs:
      label:
        description: "保存名（例: koyomi-20260924）"
        required: true
        default: "screens"
      urls:
        description: "撮影するURL（スペース区切り・https のみ・最大20件）"
        required: true
      lang:
        description: "端末の言語（ja / en など）"
        required: false
        default: "ja"
      login_urls:
        description: "試験用アカウントでログインしてから撮るURL（任意・スペース区切り・コヨミボシのみ）"
        required: false
        default: ""
      device:
        description: "端末名に含まれる語（例: iPhone 17 / iPhone SE）。無ければ最初の iPhone"
        required: false
        default: "iPhone 17"

permissions:
  contents: read

concurrency:
  group: screens
  cancel-in-progress: false

jobs:
  shoot:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Shoot
        env:
          URLS: ${{ inputs.urls }}
          DEVICE: ${{ inputs.device }}
          LANG_CODE: ${{ inputs.lang }}
          LABEL: ${{ inputs.label }}
        run: bash scripts/shoot.sh
      - name: Shoot after login
        if: ${{ inputs.login_urls != '' }}
        env:
          URLS: ${{ inputs.login_urls }}
          LOGIN_URL: https://koyomiboshi.com/fortune/login.html
          TEST_EMAIL: ${{ secrets.KOYOMI_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.KOYOMI_TEST_PASSWORD }}
        run: |
          [ -n "$TEST_EMAIL" ] && [ -n "$TEST_PASSWORD" ] || { echo "Secret が未登録です"; exit 1; }
          for url in $URLS; do
            [[ "$url" =~ ^https://koyomiboshi\.com/[^[:space:]]*$ ]] || { echo "コヨミボシ以外は不可: $url"; exit 1; }
          done
          export UDID="$(cat out/udid.txt)"
          pip3 install --quiet --break-system-packages selenium==4.* || pip3 install --quiet selenium==4.*
          sudo safaridriver --enable
          python3 scripts/login_shoot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.label }}
          path: out/
          retention-days: 14
